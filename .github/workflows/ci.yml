name: CI

on:
  pull_request:
  push:
    branches: [stable, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # Non-blocking: there is a backlog of pre-existing lint errors
        # (mostly unused imports). Surfaced here without failing the pipeline
        # so the team can burn them down without blocking merges.
        continue-on-error: true
        run: npx next lint
