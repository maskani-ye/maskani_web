name: CI

on:
  pull_request:
  push:
    branches: [stable, main]

# ⚠️ (2026-11-21) كان هذا السير يستدعي `next lint` — أُزيل في Next 16 فيفشل دائماً،
# والخطوة مخفيّة خلف `continue-on-error` — ولم يكن للويب اختبار واحد. الآن كل خطوة
# تُسقط السير، وNode بإصدار النشر نفسه (deploy.yml: 22) لا 20.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (warnings capped — see eslint.config.mjs)
        run: npm run lint

      - name: Every logic module has tests (guard)
        run: npm run audit:tests

      - name: Unit tests
        run: npm test

      - name: Source guards (ads · units · digits · design · robots · jsonld …)
        run: npm run audit
