name: Deploy

# نشر الويب إلى **Cloudflare Workers**.
#
# ⚠️ **الاستضافة على Cloudflare حصراً — ولا يُضاف مزوّدٌ آخر.** إضافة خطوة
# نشرٍ إلى مزوّدٍ غيره تعني نشراً صامتاً إلى مكانٍ لا يخدم النطاق، فيوهم أنّ
# الإنتاج تحدّث وهو لم يتحدّث.
#
# الأسرار المطلوبة: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID ·
# INTERNAL_API_TOKEN (يُعفي طلبات البناء من حدّ المعدّل).

on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  # نشرة واحدة في كل لحظة — دفعتان متتاليتان لا تتسابقان على الإنتاج.
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ⚠️ بلا هذا التوكن يُخنق البناء بـ429 فتُخبز صفحاتٌ ناقصة — وقع فعلاً.
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      NEXT_PUBLIC_API_URL: https://api.maskani.homes/api/v1
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_TOP: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_TOP }}
      NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID }}
      NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_BOTTOM: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_BOTTOM }}
      NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST }}
      NEXT_PUBLIC_ADSENSE_SLOT_LIST: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_LIST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # البناء يجري هنا ويجلب من api.maskani.homes — وهو ما كان يفشل سابقاً
      # لولا توقيع الطلبات بالتوكن الداخليّ وسقف التزامن في `lib/fetchRetry.ts`.
      - name: Build and deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy

      # ⚠️ **حارس الأسواق — يفحص الموقع الحيّ بعد النشر، ويُسقط التشغيل إن فشل.**
      # كان الحارس مكتوباً منذ حادثة ٣٠‑٠٨ لكنّه **لم يُربَط بالنشر قطّ**، فلم
      # يُشغَّل مرّة. وفي ٢٤‑٠٩ ردّت الأسواق الستّة كلّها 404 ساعةً حتى أبلغَنا
      # جوجل — لا بناؤنا. حارسٌ لا يُنفَّذ ليس حارساً.
      #
      # ولا `continue-on-error` هنا: سقوط صفحات الأسواق عطلٌ يستحقّ رايةً حمراء،
      # لا سطراً في سجلّ يمرّ.
      - name: Verify sitemap is complete
        run: npx tsx scripts/audit-sitemap-size.ts https://maskani.homes

      - name: Verify market pages are live
        run: |
          sleep 20      # مهلة انتشار النشرة على الحافة قبل الحكم
          npx tsx scripts/audit-market-pages.ts https://maskani.homes

      # إخطار محرّكات البحث بالصفحات فور النشر (IndexNow — Bing/Yandex).
      # فشلُه لا يُسقط النشر: الموقع منشور أصلاً وهذه خطوة تسويقية لا حرجة.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
