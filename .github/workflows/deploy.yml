name: Deploy

# مشروع Vercel **غير مربوط** بمستودع GitHub (ربط Git يتطلّب تفويضاً بشرياً من
# المتصفّح)، فلا يوجد نشر تلقائي أصلاً — كان كل دفع يبقى بلا أثر على الإنتاج
# حتى يُنشر أحدهم يدوياً. هذا الـworkflow يسدّ الفجوة: كل دفع إلى فرع النشر
# يبني وينشر إلى الإنتاج بتوكن Vercel.
#
# الأسرار المطلوبة (مضبوطة على المستودع): VERCEL_TOKEN · VERCEL_ORG_ID ·
# VERCEL_PROJECT_ID.

on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  # نشرة واحدة في كل لحظة — دفعتان متتاليتان لا تتسابقان على الإنتاج.
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
