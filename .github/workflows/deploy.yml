name: Deploy

# مشروع Vercel **غير مربوط** بمستودع GitHub (ربط Git يتطلّب تفويضاً بشرياً من
# المتصفّح)، فلا يوجد نشر تلقائي أصلاً — كان كل دفع يبقى بلا أثر على الإنتاج
# حتى يُنشر أحدهم يدوياً. هذا الـworkflow يسدّ الفجوة: كل دفع إلى فرع النشر
# يبني وينشر إلى الإنتاج بتوكن Vercel.
#
# الأسرار المطلوبة (مضبوطة على المستودع): VERCEL_TOKEN · VERCEL_ORG_ID ·
# VERCEL_PROJECT_ID.

on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  # نشرة واحدة في كل لحظة — دفعتان متتاليتان لا تتسابقان على الإنتاج.
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # البناء يجري على **Vercel** لا هنا: توليد الصفحات الثابتة يجلب من
      # api.maskani.homes، وخوادم GitHub لا تصله ضمن مهلة 60 ثانية فتفشل
      # الصفحات المولّدة (blog/category · sitemap · terms). خوادم Vercel تصله،
      # وهي المسار الذي أثبت نجاحه.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      # إخطار محرّكات البحث بالصفحات فور النشر (IndexNow — Bing/Yandex).
      # فشلُه لا يُسقط النشر: الموقع منشور أصلاً وهذه خطوة تسويقية لا حرجة.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
